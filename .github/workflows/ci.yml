# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  PROJECT_NAME: "caskade"

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        backend: [torch, numpy, jax]
    
    name: Python ${{ matrix.python-version }} - OS ${{ matrix.os }} - Backend ${{ matrix.backend }}

    steps:
      - name: Checkout caskade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Record State
        run: |
          pwd
          echo github.ref is: ${{ github.ref }}
          echo GITHUB_SHA is: $GITHUB_SHA
          echo github.event_name is: ${{ github.event_name }}
          echo github workspace: ${{ github.workspace }}
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov wheel pydantic

      # We only want to install this on one run, because otherwise we'll have
      # duplicate annotations.
      - name: Install error reporter
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          python -m pip install pytest-github-actions-annotate-failures

      - name: Install graphviz ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
        shell: bash

      - name: Install graphviz macOS
        if: ${{ matrix.os == 'macOS-latest' }}
        run: |
          brew install graphviz
        shell: bash

      # The download through chocolatey fails now and then, and has also been
      # seen to report success with nothing installed. So it is tried a few
      # times and checked by running dot. If it still is not there, the tests
      # that draw a graph are skipped on Windows (see tests/conftest.py)
      # and the job carries on with a warning.
      - name: Install graphviz windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          dot="/c/Program Files/Graphviz/bin/dot.exe"
          for attempt in 1 2 3 4; do
            # --force, so that a retry installs again when the last one claimed success
            choco install graphviz -y --no-progress --force || true
            if "$dot" -V; then
              break
            fi
            echo "Graphviz is not installed after attempt $attempt"
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 20))
            fi
          done
          if "$dot" -V; then
            echo "C:\\Program Files\\Graphviz\\bin" >> $GITHUB_PATH
          else
            echo "::warning::Graphviz could not be installed, the tests that draw a graph are skipped"
          fi
        shell: bash

      - name: Install caskade
        run: |
          pip install -e ".[dev,${{ matrix.backend }}]"
          pip show ${{ env.PROJECT_NAME }}
        shell: bash
        env:
          JAX_ENABLE_X64: "True"

      - name: Test with pytest
        run: |
          echo "Running tests for backend: ${{ matrix.backend }}"
          coverage run --source=${{ env.PROJECT_NAME }} -m pytest tests/
          ls -a
          cat .coverage
        shell: bash

      - name: Extra coverage report for jax checks
        if:
            ${{ matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' && matrix.backend == 'torch' }}
        run: |
          echo "Running extra coverage report for jax checks"
          pip install jax jaxlib
          coverage run --append --source=${{ env.PROJECT_NAME }} -m pytest tests/
        shell: bash
        env:
          CASKADE_BACKEND: jax
          JAX_ENABLE_X64: "True"
      - name: Extra coverage report for numpy checks
        if:
            ${{ matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' && matrix.backend == 'torch' }}
        run: |
          echo "Running extra coverage report for numpy checks"
          coverage run --append --source=${{ env.PROJECT_NAME }} -m pytest tests/
          ls -a
          cat .coverage
          coverage report -m
          coverage xml
          coverage report -m
        shell: bash
        env:
          CASKADE_BACKEND: numpy
      - name: Upload coverage reports to Codecov with GitHub Action
        if:
          ${{ matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' && matrix.backend == 'torch' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
