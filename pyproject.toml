[build-system]
requires = ["hatchling", "hatch-requirements-txt", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "caskade"
dynamic = ["version"]
authors = [
  { name="Connor Stone", email="connorstone628@gmail.com" },
  { name="Alexandre Adam", email="alexandre.adam@mila.quebec" },
]
description = "caskade handles your parameters for you without getting in your way."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
        "caskade",
        "DAG",
        "scientific python",
        "differentiable programming",
        "pytorch",
        "jax",
]
classifiers=[
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3"
]
dependencies = ["numpy>=1.24.0"]

[project.urls]
Homepage = "https://caskade.readthedocs.io"
Documentation = "https://caskade.readthedocs.io"
Repository = "https://github.com/ConnorStoneAstro/caskade"
Issues = "https://github.com/ConnorStoneAstro/caskade/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<5",
    "pytest-mock>=3.12,<4",
    "pre-commit>=3.6,<5",
    "graphviz>=0.17,<1",
    "h5py>=3.11,<4",
    "nbconvert",
    "matplotlib",
    "emcee",
    "scipy",
    "ipywidgets",
]
torch = ["torch>=2,<3"]
jax = ["jax>=0.7.0"]
numpy = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/caskade/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E4",  # imports
    "E7",  # statements, including bare except
    "E9",  # syntax errors
    "F",   # pyflakes: undefined names, unused imports and variables
    "B",   # bugbear: likely bugs and design problems
]
ignore = [
    "B028",  # warnings.warn without an explicit stacklevel
    "B905",  # zip() without an explicit strict=
]

[tool.ruff.lint.per-file-ignores]
# Tests check that an attribute access raises, and build throwaway classes
"tests/*" = ["B006", "B018"]

[tool.mypy]
files = ["src/caskade"]

[[tool.mypy.overrides]]
# Optional dependencies, and the version file that only exists once installed
module = ["torch.*", "jax.*", "h5py.*", "graphviz.*", "caskade._version"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Not type clean yet. Remove a module from this list once its errors are fixed.
module = ["caskade.mixins"]
ignore_errors = true

[tool.pytest.ini_options]
norecursedirs = "tests/utils"
